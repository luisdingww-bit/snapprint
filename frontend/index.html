<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 云端部署时：把 content 改成你的后端 API 地址，例如 https://snapprint-api.onrender.com -->
  <meta name="api-base" content="" />
  <title>SnapPrint · 咔印3D — 照片转可打印 3D 模型</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e8ecf3;
      --muted:#9aa4b2; --accent:#ff5a3c; --accent2:#3ddc97; --blue:#5b9dff;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--txt);line-height:1.6}
    header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;
      align-items:center;gap:14px;flex-wrap:wrap}
    header .logo{font-size:26px;font-weight:800;letter-spacing:.5px}
    header .logo b{color:var(--accent)}
    header .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);
      padding:2px 8px;border-radius:999px}
    .wrap{max-width:1080px;margin:0 auto;padding:24px;display:grid;
      grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:820px){.wrap{grid-template-columns:1fr}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:20px}
    h2{margin:0 0 14px;font-size:16px}
    .drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:34px 16px;
      text-align:center;color:var(--muted);cursor:pointer;transition:.2s}
    .drop:hover{border-color:var(--accent);color:var(--txt);background:#1b1e26}
    .drop b{color:var(--txt)}
    .drop input[type=file]{display:none}
    .modes{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
    .modes button{flex:1;min-width:140px;background:#1b1e26;border:1px solid var(--line);
      color:var(--muted);padding:9px;border-radius:10px;cursor:pointer;font-size:13px}
    .modes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
    .field{margin:12px 0}
    .field label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
    .field input[type=range]{width:100%;accent-color:var(--accent)}
    .row{display:flex;gap:10px}
    .row .field{flex:1}
    .go{width:100%;margin-top:16px;background:var(--accent);color:#fff;border:0;
      padding:13px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}
    .go:disabled{opacity:.5;cursor:not-allowed}
    .preview{height:260px;background:#0b0d11;border-radius:12px;border:1px solid var(--line);
      display:flex;align-items:center;justify-content:center;color:var(--muted);
      font-size:13px;overflow:hidden;text-align:center;padding:12px}
    .preview img{max-width:100%;max-height:100%;border-radius:8px}
    .stats{font-size:13px}
    .stats .grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:6px}
    .stats .k{color:var(--muted)}
    .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
    .ok{background:rgba(61,220,151,.15);color:var(--accent2)}
    .no{background:rgba(255,90,60,.15);color:var(--accent)}
    .dl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .dl a{text-decoration:none;background:#1b1e26;border:1px solid var(--line);
      color:var(--blue);padding:8px 13px;border-radius:9px;font-size:13px}
    .hint{font-size:12px;color:var(--muted);margin-top:10px}
    .err{font-size:12px;color:var(--accent);margin-top:10px;white-space:pre-wrap}
    .hidden{display:none}
    /* 异步任务进度条 */
    .pbox{margin-top:14px}
    .pbar{height:10px;background:#1b1e26;border:1px solid var(--line);border-radius:999px;overflow:hidden}
    .pbar i{display:block;height:100%;width:0;border-radius:999px;
      background:linear-gradient(90deg,var(--accent),#ff8a3c);transition:width .4s ease}
    .pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
    .pmeta b{color:var(--txt);font-weight:600}
  </style>
</head>
<body>
  <header>
    <div class="logo">Snap<b>Print</b> · 咔印3D</div>
    <div class="tag">照片 → 可打印 3D · 开源 · Apache-2.0</div>
  </header>

  <div class="wrap">
    <!-- 左：上传与参数 -->
    <div class="card">
      <h2>① 选择照片</h2>
      <label class="drop" id="drop">
        点击选择，或把图片拖到这里<br><b>支持 JPG / PNG</b>
        <input type="file" id="file" accept="image/*" />
      </label>

      <h2 style="margin-top:20px">② 选择模式</h2>
      <div class="modes" id="modes">
        <button type="button" data-mode="relief" class="on">浮雕模式（离线·零依赖）</button>
        <button type="button" data-mode="hunyuan3d">AI 模式（Hunyuan3D）</button>
        <button type="button" data-mode="triposr">AI 模式（TripoSR）</button>
      </div>

      <h2>③ 打印参数（毫米）</h2>
      <div class="row">
        <div class="field">
          <label>宽度 <span id="vw">60</span> mm</label>
          <input type="range" id="tile_w" min="20" max="200" value="60" />
        </div>
        <div class="field">
          <label>深度 <span id="vd">60</span> mm</label>
          <input type="range" id="tile_d" min="20" max="200" value="60" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>底座厚 <span id="vb">2</span> mm</label>
          <input type="range" id="base" min="0" max="10" step="0.5" value="2" />
        </div>
        <div class="field">
          <label>浮雕高 <span id="vr">4</span> mm</label>
          <input type="range" id="relief" min="0.5" max="20" step="0.5" value="4" />
        </div>
      </div>

      <button type="button" class="go" id="go" disabled>生成可打印 3D 模型</button>
      <div class="pbox hidden" id="pbox">
        <div class="pbar"><i id="pfill"></i></div>
        <div class="pmeta"><b id="pstage">排队中</b><span id="ppct">0%</span></div>
      </div>
      <div class="hint" id="status">请先选择一张图片。</div>
      <div class="err hidden" id="err"></div>
    </div>

    <!-- 右：预览与结果 -->
    <div class="card">
      <h2>预览 & 结果</h2>
      <div class="preview" id="preview">生成后在此显示预览与下载</div>
      <div id="result" class="hidden">
        <div class="stats">
          <div>水密（可切片）：<span id="wt" class="badge"></span>
            <span id="mode" class="badge" style="margin-left:8px;background:#223;color:var(--blue)"></span></div>
          <div class="grid">
            <div class="k">尺寸(mm)</div><div id="size">—</div>
            <div class="k">体积(cm³)</div><div id="vol">—</div>
            <div class="k">面数</div><div id="faces">—</div>
            <div class="k">顶点</div><div id="verts">—</div>
          </div>
        </div>
        <div class="dl" id="dl"></div>
        <div class="hint">带颜色的模型请用 <b>PLY</b> 或 <b>3MF</b>；OBJ 为纯几何，兼容所有切片软件。</div>
      </div>
    </div>
  </div>

<script>
  // 任何脚本错误都显示出来，方便排查（尤其在受限环境）
  window.addEventListener("error", function(e){
    var el=document.getElementById("err");
    if(el){ el.classList.remove("hidden"); el.textContent="页面脚本出错："+(e.message||e.error||"未知错误"); }
  });

  var API = (document.querySelector('meta[name="api-base"]')||{}).content || "";
  var mode = "relief", file = null;
  function $(id){ return document.getElementById(id); }

  // 模式切换
  document.getElementById("modes").addEventListener("click", function(e){
    var b = e.target.closest("button[data-mode]");
    if(!b) return;
    document.querySelectorAll(".modes button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on"); mode = b.dataset.mode;
  });

  // 滑块联动
  [["tile_w","vw"],["tile_d","vd"],["base","vb"],["relief","vr"]].forEach(function(p){
    var el=$(p[0]); el.addEventListener("input", function(){ $(p[1]).textContent = el.value; });
  });

  // 上传
  var drop = $("drop"), fileInput = $("file");
  fileInput.addEventListener("change", function(e){ pick(e.target.files[0]); });
  ["dragover","dragenter"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.style.borderColor="var(--accent)"; });
  });
  ["dragleave","drop"].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.style.borderColor="var(--line)"; });
  });
  drop.addEventListener("drop", function(e){ pick(e.dataTransfer.files[0]); });

  function pick(f){
    if(!f) return;
    file = f;
    drop.innerHTML = "已选择：<b>" + f.name + "</b>" +
      "<input type=\"file\" id=\"file\" accept=\"image/*\" />";
    // 重新绑定（innerHTML 替换后旧 input 失效）
    $("file").addEventListener("change", function(e){ pick(e.target.files[0]); });
    $("go").disabled = false;
    $("status").textContent = "就绪，点击生成。";
  }

  // —— 进度条 UI ——
  function progressShow(on){
    $("pbox").classList.toggle("hidden", !on);
    if(on) progressSet("排队中", 0);
  }
  function progressSet(stage, pct){
    $("pfill").style.width = pct + "%";
    $("pstage").textContent = stage;
    $("ppct").textContent = pct + "%";
  }

  // —— 生成：优先走异步任务队列（AI 模式耗时长，前端轮询显示分阶段进度）——
  //     老版本后端没有 /api/generate_async 时自动回退到同步接口。
  var polling = null;
  function finishJob(ok, msg){
    if(polling){ clearInterval(polling); polling = null; }
    $("go").disabled = false;
    $("status").textContent = msg;
    if(!ok) progressShow(false);
  }
  function pollTask(taskId){
    polling = setInterval(function(){
      fetch(API + "/api/tasks/" + taskId)
        .then(function(r){ return r.json().then(function(j){ return r.ok ? j : Promise.reject(new Error(j.detail||"查询失败")); }); })
        .then(function(t){
          progressSet(t.stage || "处理中", t.progress || 0);
          if(t.status === "done"){
            show(t.result);
            progressSet("完成", 100);
            finishJob(true, "完成 ✅");
          }else if(t.status === "error"){
            finishJob(false, "错误：" + (t.error || "生成失败"));
          }
        })
        .catch(function(e){ finishJob(false, "错误：" + e.message); });
    }, 800);
  }
  $("go").addEventListener("click", function(){
    if(!file) return;
    $("go").disabled = true;
    $("status").textContent = mode === "relief" ? "生成中…（离线浮雕通常 1–3 秒）" : "已提交任务，AI 模式可能需要数十秒到几分钟…";
    var fd = new FormData();
    fd.append("file", file);
    fd.append("mode", mode);
    fd.append("tile_w", $("tile_w").value);
    fd.append("tile_d", $("tile_d").value);
    fd.append("base", $("base").value);
    fd.append("relief", $("relief").value);
    progressShow(true);
    fetch(API + "/api/generate_async", { method:"POST", body: fd })
      .then(function(r){
        if(r.status === 404 || r.status === 405) return Promise.reject({fallback:true});
        return r.json().then(function(j){ return r.ok ? j : Promise.reject(new Error(j.detail||"提交失败")); });
      })
      .then(function(j){ pollTask(j.task_id); })
      .catch(function(e){
        if(e && e.fallback){
          // 老后端回退：同步接口
          fetch(API + "/api/generate", { method:"POST", body: fd })
            .then(function(r){ return r.json().then(function(j){ return r.ok ? j : Promise.reject(new Error(j.detail||"生成失败")); }); })
            .then(function(j){ show(j); progressSet("完成", 100); finishJob(true, "完成 ✅"); })
            .catch(function(err){ finishJob(false, "错误：" + err.message); });
        }else{
          finishJob(false, "错误：" + e.message);
        }
      });
  });

  function show(j){
    var s = j.stats;
    $("result").classList.remove("hidden");
    var wt = $("wt"); wt.textContent = s.watertight ? "是" : "否";
    wt.className = "badge " + (s.watertight ? "ok" : "no");
    $("mode").textContent = "模式：" + j.mode;
    $("size").textContent = s.size_mm.map(function(x){ return x.toFixed(1); }).join(" × ");
    $("vol").textContent = s.volume_cm3;
    $("faces").textContent = s.faces.toLocaleString();
    $("verts").textContent = s.vertices.toLocaleString();
    // 预览：显示上传图缩略图（零外部依赖，稳定）
    var pv = $("preview"); pv.innerHTML = "";
    if(file){ var img = document.createElement("img"); img.src = URL.createObjectURL(file); pv.appendChild(img); }
    // 下载
    var dl = $("dl"); dl.innerHTML = "";
    var names = { obj:"OBJ（几何）", ply:"PLY（带颜色）", "3mf":"3MF（打印）" };
    Object.keys(j.files).forEach(function(k){
      if(k === "3mf_error") return;
      var a = document.createElement("a");
      a.href = API ? API + j.files[k] : j.files[k];
      a.download = "";
      a.textContent = names[k] || k.toUpperCase();
      dl.appendChild(a);
    });
    if(j.files["3mf_error"]){
      var h = document.createElement("div"); h.className = "hint";
      h.textContent = "3MF 导出失败：" + j.files["3mf_error"]; dl.appendChild(h);
    }
  }
</script>
</body>
</html>
