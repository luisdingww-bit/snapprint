<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapPrint · 咔印3D — 照片转可打印 3D 模型</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e8ecf3;
      --muted:#9aa4b2; --accent:#ff5a3c; --accent2:#3ddc97; --blue:#5b9dff;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--txt);line-height:1.6}
    header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;
      align-items:center;gap:14px}
    header .logo{font-size:26px;font-weight:800;letter-spacing:.5px}
    header .logo b{color:var(--accent)}
    header .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);
      padding:2px 8px;border-radius:999px}
    .wrap{max-width:1080px;margin:0 auto;padding:24px;display:grid;
      grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:820px){.wrap{grid-template-columns:1fr}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:20px}
    h2{margin:0 0 14px;font-size:16px}
    .drop{border:2px dashed var(--line);border-radius:12px;padding:34px 16px;
      text-align:center;color:var(--muted);cursor:pointer;transition:.2s}
    .drop.over{border-color:var(--accent);color:var(--txt);background:#1b1e26}
    .drop b{color:var(--txt)}
    .modes{display:flex;gap:8px;margin:14px 0}
    .modes button{flex:1;background:#1b1e26;border:1px solid var(--line);
      color:var(--muted);padding:9px;border-radius:10px;cursor:pointer;font-size:13px}
    .modes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
    .field{margin:12px 0}
    .field label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
    .field input[type=range]{width:100%;accent-color:var(--accent)}
    .row{display:flex;gap:10px}
    .row .field{flex:1}
    .go{width:100%;margin-top:16px;background:var(--accent);color:#fff;border:0;
      padding:13px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}
    .go:disabled{opacity:.5;cursor:not-allowed}
    .preview{height:240px;background:#0b0d11;border-radius:12px;border:1px solid var(--line);
      display:flex;align-items:center;justify-content:center;color:var(--muted);
      font-size:13px;overflow:hidden}
    .preview canvas{max-width:100%;max-height:100%}
    .stats{font-size:13px}
    .stats .grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:6px}
    .stats .k{color:var(--muted)}
    .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
    .ok{background:rgba(61,220,151,.15);color:var(--accent2)}
    .no{background:rgba(255,90,60,.15);color:var(--accent)}
    .dl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .dl a{text-decoration:none;background:#1b1e26;border:1px solid var(--line);
      color:var(--blue);padding:8px 13px;border-radius:9px;font-size:13px}
    .hint{font-size:12px;color:var(--muted);margin-top:10px}
    .hidden{display:none}
  </style>
</head>
<body>
  <header>
    <div class="logo">Snap<b>Print</b> · 咔印3D</div>
    <div class="tag">照片 → 可打印 3D · 开源 · Apache-2.0</div>
  </header>

  <div class="wrap">
    <!-- 左：上传与参数 -->
    <div class="card">
      <h2>① 上传照片</h2>
      <div class="drop" id="drop">
        点击或拖拽图片到此处<br><b>支持 JPG / PNG</b>
        <input type="file" id="file" accept="image/*" class="hidden" />
      </div>

      <h2 style="margin-top:20px">② 选择模式</h2>
      <div class="modes">
        <button data-mode="relief" class="on">浮雕模式（离线·零依赖）</button>
        <button data-mode="hunyuan3d">AI 模式（Hunyuan3D）</button>
        <button data-mode="triposr">AI 模式（TripoSR）</button>
      </div>

      <h2>③ 打印参数（毫米）</h2>
      <div class="row">
        <div class="field">
          <label>宽度 <span id="vw">60</span> mm</label>
          <input type="range" id="tile_w" min="20" max="200" value="60" />
        </div>
        <div class="field">
          <label>深度 <span id="vd">60</span> mm</label>
          <input type="range" id="tile_d" min="20" max="200" value="60" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>底座厚 <span id="vb">2</span> mm</label>
          <input type="range" id="base" min="0" max="10" step="0.5" value="2" />
        </div>
        <div class="field">
          <label>浮雕高 <span id="vr">4</span> mm</label>
          <input type="range" id="relief" min="0.5" max="20" step="0.5" value="4" />
        </div>
      </div>

      <button class="go" id="go" disabled>生成可打印 3D 模型</button>
      <div class="hint" id="status">请先选择一张图片。</div>
    </div>

    <!-- 右：预览与结果 -->
    <div class="card">
      <h2>预览 & 结果</h2>
      <div class="preview" id="preview">生成后在此显示 3D 预览</div>
      <div id="result" class="hidden">
        <div class="stats">
          <div>水密（可切片）：<span id="wt" class="badge"></span>
            <span id="mode" class="badge" style="margin-left:8px;background:#223;color:var(--blue)"></span></div>
          <div class="grid">
            <div class="k">尺寸(mm)</div><div id="size">—</div>
            <div class="k">体积(cm³)</div><div id="vol">—</div>
            <div class="k">面数</div><div id="faces">—</div>
            <div class="k">顶点</div><div id="verts">—</div>
          </div>
        </div>
        <div class="dl" id="dl"></div>
        <div class="hint">带颜色的模型请用 <b>PLY</b> 或 <b>3MF</b>；OBJ 为纯几何，兼容所有切片软件。</div>
      </div>
    </div>
  </div>

<script>
  let mode="relief", file=null;
  const $=id=>document.getElementById(id);

  // 模式切换
  document.querySelectorAll(".modes button").forEach(b=>{
    b.onclick=()=>{document.querySelectorAll(".modes button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on"); mode=b.dataset.mode;};});

  // 滑块联动
  const bind=(id,label)=>{const e=$(id);e.oninput=()=>$(label).textContent=e.value;};
  bind("tile_w","vw");bind("tile_d","vd");bind("base","vb");bind("relief","vr");

  // 上传
  const drop=$("drop");
  drop.onclick=()=>$("file").click();
  $("file").onchange=e=>pick(e.target.files[0]);
  ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
  drop.addEventListener("drop",e=>pick(e.dataTransfer.files[0]));

  function pick(f){ if(!f)return; file=f; drop.innerHTML="已选择：<b>"+f.name+"</b>"; $("go").disabled=false; $("status").textContent="就绪，点击生成。"; }

  // 生成
  $("go").onclick=async()=>{
    if(!file)return;
    $("go").disabled=true; $("status").textContent="生成中…（离线浮雕通常 1–3 秒）";
    const fd=new FormData();
    fd.append("file",file);
    fd.append("mode",mode);
    fd.append("tile_w",$("tile_w").value);
    fd.append("tile_d",$("tile_d").value);
    fd.append("base",$("base").value);
    fd.append("relief",$("relief").value);
    try{
      const r=await fetch("/api/generate",{method:"POST",body:fd});
      const j=await r.json();
      if(!r.ok)throw new Error(j.detail||"生成失败");
      show(j);
      $("status").textContent="完成 ✅";
    }catch(e){ $("status").textContent="错误："+e.message; }
    finally{ $("go").disabled=false; }
  };

  function show(j){
    const s=j.stats;
    $("result").classList.remove("hidden");
    const wt=$("wt"); wt.textContent=s.watertight?"是":"否";
    wt.className="badge "+(s.watertight?"ok":"no");
    $("mode").textContent="模式："+j.mode;
    $("size").textContent=s.size_mm.map(x=>x.toFixed(1)).join(" × ");
    $("vol").textContent=s.volume_cm3;
    $("faces").textContent=s.faces.toLocaleString();
    $("verts").textContent=s.vertices.toLocaleString();
    // 下载
    const dl=$("dl"); dl.innerHTML="";
    const names={obj:"OBJ（几何）",ply:"PLY（带颜色）",3mf:"3MF（打印）"};
    for(const[k,v]of Object.entries(j.files)){
      if(k==="3mf_error"){continue;}
      const a=document.createElement("a");a.href=v;a.download="";a.textContent=names[k]||k.toUpperCase();
      dl.appendChild(a);
    }
    if(j.files["3mf_error"]){const h=document.createElement("div");h.className="hint";
      h.textContent="3MF 导出失败："+j.files["3mf_error"];dl.appendChild(h);}
    loadPreview(j.files.obj);
  }

  // 3D 预览（从 CDN 动态加载 three.js；失败则忽略，不影响下载）
  async function loadPreview(objUrl){
    if(!objUrl)return;
    try{
      const T=await import("https://unpkg.com/three@0.160.0/build/three.module.js");
      const {OBJLoader}=await import("https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js");
      const scene=new T.Scene();scene.background=new T.Color(0x0b0d11);
      const cam=new T.PerspectiveCamera(45,1,0.1,1000);cam.position.set(60,60,60);
      const renderer=new T.WebGLRenderer({antialias:true});
      renderer.setSize(260,240);$("preview").innerHTML="";$("preview").appendChild(renderer.domElement);
      scene.add(new T.AmbientLight(0xffffff,.7));
      const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(1,1,1);scene.add(dl);
      new OBJLoader().load(objUrl,o=>{scene.add(o);renderer.render(scene,cam);});
    }catch(e){ $("preview").textContent="（预览需联网加载，下载不受影响）"; }
  }
</script>
</body>
</html>
